<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{LIBRARY_TITLE}} · {{BRAND_NAME}}</title>
<meta name="description" content="{{LIBRARY_TITLE}} — ebook hệ thống hóa từ các buổi học, workshop." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#060f22; --bg-2:#0b1a39; --line:#16294c; --line-strong:#1d3763;
    --accent:#e11d2a; --accent-2:#f4b423;
    --text:#f2f6ff; --muted:#9fb2d4; --muted-2:#6f83a8;
    --paper:rgba(255,255,255,.028);
    --hand:'Caveat','Bradley Hand','Noteworthy','Segoe Script',cursive;
  }
  @media (prefers-color-scheme: light){
    :root{--bg:#fdfcf9;--bg-2:#ffffff;--line:#e3e8f1;--line-strong:#c9d2e2;--accent:#c9151f;--accent-2:#8a6206;
      --text:#16233d;--muted:#55637f;--muted-2:#7a8aa5;--paper:rgba(20,35,70,.035);}
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--text);
    line-height:1.7;font-size:16px;-webkit-font-smoothing:antialiased;
    background:linear-gradient(var(--paper) 1px,transparent 1px) 0 0/100% 30px,
      linear-gradient(90deg,var(--paper) 1px,transparent 1px) 0 0/30px 100%,var(--bg);}
  a{color:inherit;}
  .wrap{max-width:1040px;margin:0 auto;padding:0 20px;}
  header{border-bottom:1px solid var(--line);padding:36px 0 46px;}
  .brand{font-weight:800;font-size:20px;letter-spacing:-.3px;}
  .brand:first-letter{color:var(--accent);}
  .eyebrow{margin-top:44px;font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);font-weight:700;}
  h1{font-size:clamp(32px,6vw,56px);line-height:1.05;font-weight:800;letter-spacing:-1.2px;margin:12px 0 0;max-width:18ch;}
  h1 em{font-style:normal;color:var(--accent-2);}
  .sub{color:var(--muted);font-size:17px;max-width:56ch;margin-top:16px;}
  main{padding:34px 0 60px;}
  .lbl{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted-2);margin:0 0 6px;}
  .list{border-top:1px solid var(--line-strong);}
  .card{display:grid;grid-template-columns:180px 1fr;gap:6px 28px;padding:22px 0;border-bottom:1px solid var(--line);text-decoration:none;}
  .card:hover h3{color:var(--accent-2);}
  .card .tag{grid-row:span 3;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;padding-top:6px;}
  .card h3{margin:0;font-size:21px;line-height:1.3;font-weight:700;letter-spacing:-.3px;transition:color .15s;}
  .card p{margin:0;color:var(--muted);font-size:15px;}
  .card .meta{font-size:12.5px;color:var(--muted-2);}
  @media(max-width:640px){.card{grid-template-columns:1fr;}.card .tag{grid-row:auto;padding:0;}}
  .empty{display:none;color:var(--muted);padding:26px 0;font-family:var(--hand);font-size:24px;}
  .list:not(:has(.card)) + .empty{display:block;}
  footer{border-top:1px solid var(--line);padding:26px 0 44px;font-size:12.5px;color:var(--muted-2);}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">{{BRAND_NAME}}</div>
    <div class="eyebrow">Ebook · Ghi chép &amp; hệ thống hóa</div>
    <h1>{{LIBRARY_TITLE}}: <em>học xong, làm được ngay</em></h1>
    <p class="sub">Mỗi bài là một ebook hệ thống hóa từ buổi học, workshop — viết cho người đọc, cuối mỗi chương có việc cụ thể để làm.</p>
  </div>
</header>
<main>
  <div class="wrap">
    <p class="lbl">Các bài học</p>
    <div class="list">
<!-- LESSONS -->
    </div>
    <p class="empty">Bài học đầu tiên sắp lên kệ…</p>
  </div>
</main>
<footer>
  <div class="wrap">© {{BRAND_NAME}} · {{BRAND_TAGLINE}}</div>
</footer>
</body>
</html>
